<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☽☾ ムーン 🌙</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #1a202c;
            color: #f0f2f5;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            margin-top: 40px;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        .song-list {
            --card-ratio: 420 / 236;
            /* Keep preview capture math consistent */
            display: grid;
            width: 100%;
            max-width: 1200px;
            gap: 32px;
            grid-template-columns: 1fr;
            /* Mobile default */
            padding: 0 16px 48px;
            box-sizing: border-box;
        }

        /* ≥640px: 2 columns */
        @media (min-width: 640px) {
            .song-list {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* ≥1024px: lock to exactly 3 columns (desktop 3xN) */
        @media (min-width: 1024px) {
            .song-list {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        .song-card {
            background: rgba(26, 32, 44, 0.85);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            padding: 0;
            display: block;
            position: relative;
            overflow: hidden;
            transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            outline: none;
            aspect-ratio: var(--card-ratio);
            width: 100%;
        }

        .song-card:hover,
        .song-card:focus {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            background: rgba(26, 32, 44, 1);
            text-decoration: none;
        }

        .song-card:active {
            background: #2d3748;
        }

        .song-title {
            margin: 0;
            padding: 0;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            font-size: 1.5em;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 8px #000, 0 0 2px #000;
        }

        .song-preview {
            width: 100%;
            height: 100%;
            border-radius: 8px;
            background: #2d3748;
            object-fit: cover;
            display: block;
        }

        @media (max-width: 600px) {
            .song-card {
                aspect-ratio: 16 / 9;
            }
        }

        .song-link {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 18px;
            background: #f6e05e;
            color: #1a202c;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s;
        }

        .song-link:hover {
            background: #ffe066;
        }

        .flash-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 8px 18px;
            background: #f6e05e;
            color: #1a202c;
            border-radius: 6px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s;
        }

        .flash-btn:hover {
            background: #ffe066;
        }
    </style>
</head>

<body>
    <h1>ムーン</h1>
    <div class="song-list" id="song-list"></div>
    <a class="flash-btn" href="flash/index.html">Flashcards</a>
    <script>
        // Fetch the song list (slug + YouTube id) from songs.json
        function fetchSongFolders() {
            return fetch('songs.json')
                .then(r => { if (!r.ok) throw new Error('Failed to load folder list'); return r.json(); });
        }

        const songListDiv = document.getElementById('song-list');

        // Preview image: the video's YouTube thumbnail (no thumbnail until a video is linked)
        function setPreview(img, youtubeId) {
            if (youtubeId) img.src = `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`;
            else img.style.background = '#2d3748';
        }

        fetchSongFolders().then(songs => {
            songs.forEach(({ slug: folder, youtube }) => {
                const link = document.createElement('a');
                link.className = 'song-card';
                link.href = `${folder}/index.html`;
                link.setAttribute('tabindex', '0');
                link.setAttribute('aria-label', folder.replace(/-/g, ' '));

                // Thumbnail
                const img = document.createElement('img');
                img.className = 'song-preview';
                img.alt = `${folder.replace(/-/g, ' ')} preview frame`;
                img.decoding = 'async';
                img.loading = 'lazy';
                link.appendChild(img);

                // Title overlay
                const title = document.createElement('div');
                title.className = 'song-title';
                title.textContent = folder.replace(/-/g, ' ');
                link.appendChild(title);

                songListDiv.appendChild(link);

                setPreview(img, youtube);
            });
        }).catch(err => console.error(err));
    </script>
    <script src="scroll-top.js"></script>
</body>

</html>
